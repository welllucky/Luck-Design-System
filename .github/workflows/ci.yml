name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build dos pacotes
        run: pnpm build

      - name: Adaptadores gerados estão em dia
        run: git diff --exit-code -- packages/core/src/components.d.ts packages/core/src/components

      - name: Testes unitários (Stencil)
        run: pnpm test:unit

      - name: Navegador dos testes (Playwright)
        run: pnpm --filter @luck/storybook exec playwright install --with-deps chromium

      - name: Testes de histórias e usabilidade (Vitest + Storybook)
        run: pnpm test:storybook

      - name: Build do Storybook
        run: pnpm --filter @luck/storybook build

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 14

  docker:
    # Garante que a imagem de deploy do Storybook continua construindo.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storybook/Dockerfile
          push: false
          tags: luck-storybook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
