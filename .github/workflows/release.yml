name: Release

# A cada push na main: o nx release olha os commits desde a última tag de cada pacote
# (conventional commits: feat → minor, fix → patch, "BREAKING CHANGE" → major), decide
# a versão, builda, atualiza CHANGELOGs, cria commit + tags, publica no GitHub Packages
# e cria as GitHub Releases. Sem nada relevante mudado, o passo termina sem fazer nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@welllucky"

      - run: pnpm install --frozen-lockfile

      - name: Identidade do git para o commit de release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Versionar, publicar e criar as releases
        run: pnpm exec nx release --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
