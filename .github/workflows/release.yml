name: Release

# A cada push na main:
# - com changesets pendentes: abre/atualiza o PR "Versionar pacotes" (bump de versão + CHANGELOG);
# - sem changesets (ex.: depois do merge desse PR): publica no GitHub Packages as versões que
#   ainda não existem no registro e cria as tags.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@welllucky"

      - run: pnpm install --frozen-lockfile

      - name: Versionar ou publicar
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: versionar pacotes"
          commit: "chore: versionar pacotes"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
